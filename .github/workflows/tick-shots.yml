name: Clean up and take screenshots (one-time)
on:
  push:
    paths: ['.github/workflows/tick-shots.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old files
        run: git rm -r -q --ignore-unmatch css renovate.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take screenshots on a real MagicMirror
        run: |
          git clone --depth 1 https://github.com/MagicMirrorOrg/MagicMirror "$RUNNER_TEMP/mm"
          cd "$RUNNER_TEMP/mm"
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          mkdir -p modules/MMM-Ticknews
          cp "$GITHUB_WORKSPACE"/MMM-Ticknews.js "$GITHUB_WORKSPACE"/MMM-Ticknews.css "$GITHUB_WORKSPACE"/node_helper.js modules/MMM-Ticknews/
          cat > config/config.js <<'CFG'
          const themes = ["plain", "red", "blue", "orange", "gold", "black", "green", "lblue"];
          let config = {
            address: "localhost", port: 8080, ipWhitelist: [], language: "en", timeFormat: 12,
            modules: themes.map((t) => ({ module: "MMM-Ticknews", position: "top_center", config: { css: t, random: false, rotateInterval: 600000, maxWidth: "900px" } }))
          };
          if (typeof module !== "undefined") { module.exports = config; }
          CFG
          (node --run server > /tmp/mm.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 2; done
          pip install -q playwright
          python3 - <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "examples")
          os.makedirs(out, exist_ok=True)
          themes = ["plain", "red", "blue", "orange", "gold", "black", "green", "lblue"]
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome")
                  pg = await b.new_page(viewport={"width": 1920, "height": 1800})
                  await pg.goto("http://localhost:8080/")
                  await pg.wait_for_function("document.querySelectorAll('.MMM-Ticknews .tn-headline').length === 8", timeout=60000)
                  await pg.wait_for_timeout(2000)
                  mods = await pg.query_selector_all(".MMM-Ticknews .tn")
                  for t, m in zip(themes, mods):
                      await m.screenshot(path=os.path.join(out, t + ".png"))
                  await pg.click(".MMM-Ticknews .tn-red .tn-headline")
                  await pg.wait_for_timeout(1000)
                  m = await pg.query_selector(".MMM-Ticknews .tn-red")
                  await m.screenshot(path=os.path.join(out, "summary.png"))
                  await b.close()
          asyncio.run(main())
          PY
          grep -i ticknews /tmp/mm.log || true
          ls -la "$GITHUB_WORKSPACE/examples"
      - name: Commit
        run: |
          git config user.name "cowboysdude"
          git config user.email "cowboysdude@users.noreply.github.com"
          git add examples
          git commit -m "Remove old files and add screenshots"
          git push
